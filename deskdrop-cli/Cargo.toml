[package]
name = "deskdrop-cli"
version.workspace = true
edition = "2021"
description = "Deskdrop command-line management tool"
license = "AGPL-3.0-only"

[[bin]]
name = "deskdrop-cli"
path = "src/main.rs"

[dependencies]
deskdrop-core = { version = "1.2.4", path = "../deskdrop-core" }
anyhow = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
tokio = { version = "1", features = ["full"] }
